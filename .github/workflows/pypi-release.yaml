name: Publish jawm to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and verify package
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"

          if [[ "$RELEASE_TAG" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Test installed wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv /tmp/jawm-wheel-test
          source /tmp/jawm-wheel-test/bin/activate

          python -m pip install --upgrade pip
          python -m pip install dist/jawm-*.whl
          python -m pip check

          INSTALLED_VERSION="$(python -c "import importlib.metadata as m; print(m.version('jawm'))")"
          test "$INSTALLED_VERSION" = "$RELEASE_TAG"

          jawm --help
          jawm-dev --help
          jawm-monitor --help
          jawm-test --help

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/jawm
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
